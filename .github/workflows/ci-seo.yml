name: CI SEO & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci || npm install
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/skillforge
          SITE_URL: https://skillforge-jet-chi.vercel.app
          CRON_SECRET: ci-placeholder-secret
          ADMIN_PASSWORD: ci-placeholder-admin
          SKIP_DB_DURING_BUILD: "1"

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse CI (production URL)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://skillforge-jet-chi.vercel.app/
            https://skillforge-jet-chi.vercel.app/about
            https://skillforge-jet-chi.vercel.app/categories/pdf
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true
